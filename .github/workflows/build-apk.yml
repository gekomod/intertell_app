name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, technician]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }} -PmapTilerApiKey=${{ secrets.MAPTILER_API_KEY }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::group::Gradle failure — full log"
            cat build.log
            echo "::endgroup::"
            # Compiler errors ("e: file:...") are the actionable part but can
            # sit anywhere in a build that's otherwise thousands of lines of
            # stack trace — surface those specifically as annotations (readable
            # via the public checks API without needing the Azure-blob-hosted
            # raw log) instead of just tailing the end of the file.
            grep -E "^e: |error:|FAILURE:|What went wrong|Unresolved reference" build.log | while IFS= read -r line; do
              esc=${line//$'\r'/}
              echo "::error::${esc}"
            done
            if ! grep -qE "^e: |error:|FAILURE:" build.log; then
              tail -n 80 build.log | while IFS= read -r line; do
                esc=${line//$'\r'/}
                echo "::error::${esc}"
              done
            fi
          fi
          exit "$code"

      - name: Rename APK
        working-directory: ${{ matrix.app }}
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/intertell-${{ matrix.app }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: intertell-${{ matrix.app }}-debug-apk
          path: dist/intertell-${{ matrix.app }}-debug.apk

  release:
    name: Publish release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          if-no-files-found: warn

      - name: Show downloaded files
        run: ls -la dist || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*.apk
          make_latest: true
